[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatory-ai-radar"
version = "0.1.0"
description = "AI-powered regulatory intelligence radar focused on artificial intelligence and financial regulation."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3"
]

[tool.setuptools.packages.find]
where = ["src"]
